# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/build_deb.sh).

NAME=clone-studio
APP_NAME=CloneStudio
GITHUB_REPO=Dhiva-Labs/CloneStudio
TAG_PREFIX=v
SUMMARY='Move everything to your new Linux computer'
DESCRIPTION='Clone Studio migrates files, apps, settings, SSH keys and desktop configuration from an old Linux computer to a new one - over Wi-Fi, a direct network cable, or a USB drive. Beginner-proof wizard, TLS-encrypted transfers with PIN pairing, journaled resume, and file-by-file selection with per-app picking.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/CloneStudio
LICENSE=MIT
LICENSE_FILE=LICENSE

# The app makes its TLS identity with the openssl command (the .deb's
# Depends). df and chmod come with every distribution.
#
# Flutter's engine opens libEGL.so.1 and libGLESv2.so.2 with dlopen, so the
# ELF scan cannot see them: they are listed here as rpm soname dependencies
# (libglvnd on Fedora, Mesa's libEGL1/libGLESv2-2 on openSUSE), and Arch gets
# libglvnd.
RPM_REQUIRES=(/usr/bin/openssl 'libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
ARCH_DEPENDS=(gtk3 openssl libglvnd)
ARCH_INDEPENDENT=0

# AppImage: it runs the host's openssl, like the .deb.
APPIMAGE=1
EXEC=usr/lib/clone-studio/clone_studio
DESKTOP=usr/share/applications/clone-studio.desktop
ICON=usr/share/icons/hicolor/256x256/apps/clone-studio.png
APPRUN_ENV=''

# Smoke test run in each distribution container by verify.sh: smoke.sh makes
# a TLS identity the way the app does, with the openssl this format gives
# it, then starts GUI_CMD and passes once the Flutter UI has painted (see
# smoke.sh).
GUI_CMD=clone-studio
SMOKE_SECONDS=120
SMOKE_CMD=''
